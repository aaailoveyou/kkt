async function manualCall(c,kind){if(CALL.st)return;const s=findCall(c.script,kind);if(!s){ptoast('剧本里还没有设置这种通话');return}const sid=S.sid,r=await startCall(c,{...s,dir:'out'});if(sid!==S.sid)return;callRec(c,{...s,dir:'out'},r)}

function inHTML(st){
 const c=st.c,vurl=st.kind==='video'&&st.s.video&&MEDIA[st.s.video],tag=st.kind==='video'?'视频通话':'语音通话',wv='<i class="wv"><b></b><b></b><b></b><b></b><b></b></i>';
 return `<div class="cc"><div class="cc-top"><div class="cc-nm"><b>${esc(c.name)}${sv('r',15,2.4)}</b><div class="tmr"><i class="tg">${tag}</i><span id="ctime">${st.phase==='dial'?'呼叫中…':mmss(st.dur||0)}</span></div></div><div class="cc-pill">${sv('adduser',20,1.7)}${sv('gear',20,1.7)}${sv('pip',20,1.7)}</div></div>
 <div class="cc-chips"><button data-a="cshare">${sv('share',16,1.8)}屏幕分享</button><button data-a="clike">${sv('like',16,1.8)}快速点赞</button><button id="chand" data-a="chand">${sv('hand',16,1.8)}举手</button><button id="ccc" data-a="ccc" class="${st.cc===false?'':'on'}"><b class="cct">CC</b>字幕</button></div>
 <div class="cc-tiles"><div class="tile" id="t-them">${vurl?`<video id="cvid" src="${vurl}" playsinline webkit-playsinline loop></video>`:bigAv(c)}<em><span>${esc(c.name)}</span>${wv}</em></div><div class="tile" id="t-me"><video id="cself" muted playsinline autoplay hidden></video><span id="mav">${bigAv({color:'#8e8e93'})}</span><div class="tbadge" id="tbme"></div><em><span>${esc(cfg.me||'我')}</span>${wv}</em></div></div>
 <div class="cc-cap" id="ccap"></div>
 <div class="cc-bar"><button class="cb">${sv('spark',23,0)}</button><button class="cb" id="cmic" data-a="cmic">${sv('mic',23,1.8)}</button><button class="cb end" data-a="cend">${sv('end',28,0)}</button><button class="cb dim">${sv('flip',23,1.7)}</button><button class="cb wh" id="ccam" data-a="ccam">${sv('vidx',23,1.9)}</button></div></div>`;
}
function startCall(c,s){return new Promise(res=>{
 const st={c,s,kind:s.kind==='video'?'video':'voice',res,phase:s.dir==='out'?'dial':'ring',idx:-1,dur:0,mic:true,cam:false,stream:null,ans:false,timers:[]};
 CALL.st=st;
 if(st.phase==='ring')showCall(ringHTML(st));else{showCall(inHTML(st));st.timers.push(setTimeout(()=>answer(st),2300*TM()))}
})}
function answer(st){
 if(!st||CALL.st!==st||st.phase==='talk')return;
 st.phase='talk';st.ans=true;st.t0=Date.now();showCall(inHTML(st));playVideo(st);
 st.tick=setInterval(()=>{st.dur=(Date.now()-st.t0)/1000|0;const e=$('#ctime');if(e)e.textContent=mmss(st.dur)},400);
 nextLine(st);
}
function playVideo(st){const v=$('#cvid');if(!v)return;v.muted=false;const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});const t=document.createElement('div');t.className='ctip';t.textContent='点按画面开启声音';$('#t-them').appendChild(t);$('#t-them').onclick=()=>{v.muted=false;t.remove()}})}
function speak(who){const a=$('#t-them'),b=$('#t-me');if(a)a.classList.toggle('sp',who==='them');if(b)b.classList.toggle('sp',who==='me')}
function showCap(st,l){const e=$('#ccap');if(!e)return;e.style.display=st.cc===false?'none':'';if(!l){e.innerHTML='';return}e.innerHTML=`<div class="cap ${l.who==='me'?'me':''}" data-a="cskip"><small><i></i>${esc(l.who==='me'?(cfg.me||'我'):st.c.name)}</small>${l.orig?`<em>${esc(l.orig)}</em>`:''}<b>${esc(l.text||'')}</b></div>`}
function nextLine(st){
 if(!st||CALL.st!==st||st.phase!=='talk')return;
 const L=st.s.lines||[];st.idx++;
 if(st.idx>=L.length){showCap(st,null);speak(null);st.timers.push(setTimeout(()=>endCall(st),1700*TM()));return}
 const l=L[st.idx];showCap(st,l);speak(l.who);
 let fired=false;const go=()=>{if(fired)return;fired=true;st.timers.push(setTimeout(()=>nextLine(st),450*TM()))},url=l.audio&&MEDIA[l.audio];
 const wait=()=>st.timers.push(setTimeout(go,Math.max(1800,500+String(l.text||l.orig||'').length*190)*TM()));
 if(url){AU.onended=go;AU.onerror=wait;AU.src=url;const p=AU.play();if(p&&p.catch)p.catch(wait)}else wait();
}
function skipLine(st){if(!st||st.phase!=='talk')return;st.timers.forEach(clearTimeout);st.timers=[];try{AU.pause()}catch(e){}AU.onended=null;AU.onerror=null;nextLine(st)}
async function toggleCam(st){
 if(!st)return;const v=$('#cself'),b=$('#ccam');if(!v)return;
 if(st.cam){st.cam=false;if(st.stream)st.stream.getTracks().forEach(t=>t.stop());st.stream=null;v.hidden=true;v.srcObject=null;$('#mav').style.display='';b.innerHTML=sv('vidx',23,1.9);return}
 try{const m=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});if(CALL.st!==st){m.getTracks().forEach(t=>t.stop());return}st.stream=m;st.cam=true;v.srcObject=m;v.hidden=false;v.style.transform='scaleX(-1)';$('#mav').style.display='none';b.innerHTML=sv('vid',23,1.9)}
 catch(e){ptoast('无法打开摄像头（需要允许访问）')}
}
function endCall(st,quiet){
 if(!st||CALL.st!==st)return;CALL.st=null;
 st.timers.forEach(clearTimeout);clearInterval(st.tick);try{AU.pause()}catch(e){}AU.onended=null;AU.onerror=null;
 if(st.stream)st.stream.getTracks().forEach(t=>t.stop());const v=$('#cvid');if(v)try{v.pause()}catch(e){}
 $('#call').className='';$('#call').innerHTML='';$('#scr').classList.remove('incall');
 st.res({ans:st.ans,dur:st.dur||0});
}

$('#scr').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=curChat();
 if(a==='open')openChat(b.dataset.id);
 else if(a==='back'){S.view='list';S.cur=null;S.menu=false;renderView()}
 else if(a==='tab'){S.tab=b.dataset.v;renderView()}
 else if(a==='pick'&&c){const rt=rtOf(c);if(rt.pick)rt.pick(+b.dataset.i)}
 else if(a==='menu'&&c){S.menu=!S.menu;uiRoom(c,true)}
 else if((a==='callv'||a==='callvid')&&c){S.menu=false;uiRoom(c,true);manualCall(c,a==='callv'?'voice':'video')}
 else if(a==='toast')ptoast('预览中无法使用')
 else if(a==='cacc')answer(CALL.st)
 else if(a==='crej'||a==='cend')endCall(CALL.st)
 else if(a==='cmic'){const s=CALL.st;if(!s)return;s.mic=!s.mic;b.innerHTML=sv(s.mic?'mic':'micx',23,1.8);badges(s)}
 else if(a==='cshare')ptoast('预览中无法共享屏幕')
 else if(a==='chand'){const s=CALL.st;if(!s)return;s.hand=!s.hand;b.classList.toggle('on',s.hand);badges(s)}
 else if(a==='ccc'){const s=CALL.st;if(!s)return;s.cc=s.cc===false;b.classList.toggle('on',s.cc!==false);const e=$('#ccap');if(e)e.style.display=s.cc===false?'none':''}
 else if(a==='clike'){const k=['👍','❤️','😊','🎉'];for(let i=0;i<4;i++){const e=document.createElement('span');e.className='fl';e.textContent=k[(Math.random()*4)|0];e.style.left=(50+Math.random()*250)+'px';e.style.animationDelay=(i*.14)+'s';$('#call').appendChild(e);setTimeout(()=>e.remove(),2200)}}
 else if(a==='ccam')toggleCam(CALL.st)
 else if(a==='cskip')skipLine(CALL.st);
});

const opt=(a,v)=>a.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('');
const COL=[['#a8c4e0','蓝'],['#b7c7e0','淡蓝'],['#e0b8b8','粉'],['#b9cdbd','绿'],['#d6c27f','黄'],['#c9bfdc','紫'],['#8e8e93','灰']];
const NEW={them:()=>({type:'msg',from:'them',text:'',tr:''}),me:()=>({type:'msg',from:'me',text:''}),choice:()=>({type:'choice',opts:[{text:'',script:[]},{text:'',script:[]}]}),call:()=>({type:'call',kind:'voice',dir:'in',video:'',lines:[{who:'them',orig:'',text:'',audio:''}]})};
const media=(p,label,acc)=>{const v=gp(p);return `<div class="f"><label>${label}</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="fb">${v?'更换文件':'上传文件'}<input type="file" accept="${acc}" hidden data-media="${p}"></label>${v?`<span class="ok">✓ 已上传</span><button class="x" data-act="rm" data-p="${p}">移除</button>`:''}</div></div>`};
const inp=(p,ph)=>`<input type="text" data-b="${p}" placeholder="${esc(ph)}" value="${esc(gp(p))}">`;
const scriptEd=(path,arr)=>`<div>${arr.map((s,i)=>stepEd(path+'.'+i,s,i,path)).join('')}<div class="addrow"><button data-act="add" data-p="${path}" data-t="them">＋ 对方消息</button><button data-act="add" data-p="${path}" data-t="me">＋ 我的消息</button><button data-act="add" data-p="${path}" data-t="choice">＋ 分支选择</button><button data-act="add" data-p="${path}" data-t="call">＋ 通话</button></div></div>`;
function stepEd(p,s,i,ap){
 const ctl=`<span class="ctl"><button data-act="mv" data-p="${ap}" data-i="${i}" data-d="-1">↑</button><button data-act="mv" data-p="${ap}" data-i="${i}" data-d="1">↓</button><button data-act="del" data-p="${ap}" data-i="${i}">×</button></span>`;
 if(s.type==='msg'&&s.from==='them')return `<div class="st them"><div class="sh"><b>对方说</b>${ctl}</div>${inp(p+'.text','原文（外语，会显示在气泡里；可留空）')}${inp(p+'.tr','中文翻译（会显示成气泡下面的白色翻译标签）')}</div>`;
 if(s.type==='msg')return `<div class="st me"><div class="sh"><b>我说</b>${ctl}</div>${inp(p+'.text','我说的话（黄色气泡）')}</div>`;
 if(s.type==='choice')return `<div class="st ch"><div class="sh"><b>⑂ 分支选择（读者二选一）</b>${ctl}</div>${(s.opts||[]).map((o,j)=>`<div class="opt"><div class="oh"><span>选项 ${j+1}</span><button class="x" data-act="delopt" data-p="${p}.opts" data-i="${j}">删除选项</button></div>${inp(p+'.opts.'+j+'.text','我的回复（读者点这个，就会作为我的消息发出去）')}<div class="lbl" style="margin-top:6px">选了这个之后，接下来发生的事：</div><div class="sub">${scriptEd(p+'.opts.'+j+'.script',o.script||[])}</div></div>`).join('')}<button class="ghost" data-act="addopt" data-p="${p}.opts">＋ 添加选项</button><p class="hint">所有分支播完后，会继续播放这个分支块下面的内容；如果下面没有内容，故事就在分支里结束。分支里还可以再放分支。</p></div>`;
 if(s.type==='call')return `<div class="st cl"><div class="sh"><b>📞 通话</b>${ctl}</div><div class="row2"><select data-b="${p}.kind">${opt([['voice','语音通话'],['video','视频通话']],s.kind||'voice')}</select><select data-b="${p}.dir">${opt([['in','对方打来'],['out','我打出去']],s.dir||'in')}</select></div>${(s.kind==='video')?media(p+'.video','对方的视频（上传后会显示在通话画面里）','video/*'):''}<div class="lbl" style="margin-top:8px">通话字幕 · 一句一句播放，可以给每句配 MP3 语音</div>${(s.lines||[]).map((l,j)=>`<div class="ln"><div class="row2"><select data-b="${p}.lines.${j}.who">${opt([['them','对方说'],['me','我说']],l.who)}</select><button class="x" data-act="delln" data-p="${p}.lines" data-i="${j}">删除这句</button></div>${inp(p+'.lines.'+j+'.orig','原文（外语，可留空）')}${inp(p+'.lines.'+j+'.text','字幕（中文）')}${media(p+'.lines.'+j+'.audio','这句的语音（MP3，可不传）','audio/*')}</div>`).join('')}<button class="ghost" data-act="addln" data-p="${p}.lines">＋ 添加一句</button></div>`;
 return '';
}

const open=new Set();

async function exportStory(){
 const media={};for(const [id,url] of Object.entries(MEDIA)){const blob=await fetch(url).then(r=>r.blob());media[id]=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob)})}
 const payload=JSON.stringify({cfg:JSON.parse(JSON.stringify(cfg)),media}).replace(/</g,'\\u003c');
 const html='<!doctype html>\n'+document.documentElement.outerHTML.replace(/<script>\s*\(\(\)=>\{/,'<script>window.__KKT_EXPORT__='+payload+';<\/script><script>(()=>{');
 const blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='story-'+new Date().toISOString().slice(0,10)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);etoast('剧本已导出，请上传到仓库 stories 文件夹');
}
